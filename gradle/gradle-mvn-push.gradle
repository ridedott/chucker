apply plugin: 'maven-publish'
apply plugin: 'signing'

group = GROUP
version = VERSION_NAME

publishing {
    repositories {
        // Dott's builds are published to this repository's GitHub Packages by publish-github-packages.yaml.
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/ridedott/chucker'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components.release
            }
            artifactId = project.name
            pom {
                name = POM_REPO_NAME
                description = POM_DESCRIPTION
                url = POM_URL
                licenses {
                    license {
                        name = POM_LICENSE_NAME
                        url = POM_LICENSE_URL
                    }
                }
                scm {
                    connection = POM_SCM_CONNECTION
                    developerConnection = POM_SCM_CONNECTION
                    url = POM_URL
                }
                developers {
                    developer {
                        id = 'cortinico'
                        name = 'Nicola Corti'
                        email = 'corti.nico@gmail.com'
                    }
                    developer {
                        id = 'vbuberen'
                        name = 'Volodymyr Buberenko'
                        email = 'v.buberenko@gmail.com'
                    }
                    developer {
                        id = 'olivierperez'
                        name = 'Olivier Perez'
                        email = 'olivier@olivierperez.fr'
                    }
                }
            }
        }
    }
}

def signingKey = findProperty("SIGNING_KEY")
def signingPwd = findProperty("SIGNING_PWD")
if (signingKey && signingPwd) {
    signing {
        useInMemoryPgpKeys(signingKey, signingPwd)
        sign publishing.publications.release
    }
} else {
    logger.info("Signing Disable as the PGP key was not found")
}
